&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;header&gt;&lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;h1&gt;&lt;span class=&quot;icon&quot; aria-hidden=&quot;true&quot;&gt;∑&lt;/span&gt; ECUACIONES SIMULTÁNEAS&lt;/h1&gt;&lt;p&gt;Formulación de raciones · Caballos cuarto de milla&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;progress&quot;&gt;&lt;span id=&quot;progress-label&quot;&gt;&lt;/span&gt;&lt;progress id=&quot;progress&quot; max=&quot;17&quot; value=&quot;0&quot; aria-label=&quot;Progreso del ejercicio&quot;&gt;&lt;/progress&gt;&lt;/div&gt;&lt;/div&gt;&lt;/header&gt;&lt;main&gt;
&lt;section class=&quot;card&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Práctica guiada · Tres incógnitas&lt;/div&gt;&lt;h2&gt;Una ración, tres balances&lt;/h2&gt;&lt;p&gt;Formula una ración para caballos cuarto de milla que contenga &lt;strong&gt;11.57% de proteína cruda&lt;/strong&gt; y &lt;strong&gt;2.89 Mcal de energía digestible por kg de materia seca&lt;/strong&gt;, respetando los ingredientes fijos del ejercicio.&lt;/p&gt;&lt;div class=&quot;goals&quot;&gt;&lt;span&gt;Inclusión: &lt;strong&gt;100%&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;PC: &lt;strong&gt;11.57%&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;ED: &lt;strong&gt;2.890 Mcal/kg MS&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;legend&quot;&gt;&lt;div class=&quot;chip x&quot;&gt;X · Heno de avena&lt;/div&gt;&lt;div class=&quot;chip y&quot;&gt;Y · Heno de alfalfa&lt;/div&gt;&lt;div class=&quot;chip z&quot;&gt;Z · Maíz rolado&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Resuelve en orden. Todos los pasos están a la vista, pero sus campos se habilitan al verificar correctamente el paso anterior. Puedes abrir una pista y volver a intentarlo sin límite.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Se conservan los datos del ejercicio original. Las inclusiones y los aportes nutricionales se calculan en base seca. Caballo de 450 kg, destinado a carreras de 300 yardas; CMS = 11.25 kg por animal. Los precios corresponden a kg de base húmeda.&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Composición e inclusiones fijas&lt;/h2&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Ingrediente&lt;/th&gt;&lt;th&gt;Inclusión (%)&lt;/th&gt;&lt;th&gt;PC (%)&lt;/th&gt;&lt;th&gt;ED (Mcal/kg)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;ingredients&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Datos adicionales: Heno de avena (X): 89.2% MS; $1.80/kg BH; Heno de alfalfa (Y): 90.5% MS; $2.50/kg BH; Maíz rolado (Z): 88.0% MS; $5.90/kg BH; Aceite vegetal: 99.8% MS; $17.50/kg BH; PMZ minerales y vitaminas: 98.0% MS; $15.50/kg BH.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;PC = proteína cruda; ED = energía digestible; PMZ = premezcla. “Variable” significa que su inclusión debe calcularse. Los valores cero son los indicados por el ejercicio, no una caracterización completa de los ingredientes.&lt;/p&gt;&lt;/section&gt;
&lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Respuestas a tres decimales.&lt;/strong&gt; Puedes usar punto o coma decimal. Redondea al final de cada respuesta. Para continuar el procedimiento, usa las ecuaciones exactas que se revelan al aprobar cada paso: redondear repetidamente los coeficientes puede alterar el resultado.&lt;/aside&gt;&lt;div id=&quot;steps&quot;&gt;&lt;/div&gt;
&lt;section id=&quot;finish&quot; class=&quot;card complete&quot; hidden&gt;&lt;div class=&quot;eyebrow&quot;&gt;Ejercicio completado&lt;/div&gt;&lt;h2&gt;Los tres balances coinciden&lt;/h2&gt;&lt;p&gt;Has resuelto el sistema por eliminación e igualación, comprobado los aportes y calculado las cantidades y el costo por caballo.&lt;/p&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Ingrediente&lt;/th&gt;&lt;th&gt;Inclusión (%)&lt;/th&gt;&lt;th&gt;Aporte PC&lt;/th&gt;&lt;th&gt;Aporte ED&lt;/th&gt;&lt;th&gt;kg BS/caballo&lt;/th&gt;&lt;th&gt;kg BH/caballo&lt;/th&gt;&lt;th&gt;MXN/caballo&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;final-table&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Tabla redondeada a tres decimales. Los totales se calculan con precisión completa: sumar las cifras visibles puede producir diferencias de 0.001 por redondeo. Esta práctica ajusta inclusión, PC y ED; no evalúa los demás requerimientos nutricionales de una dieta comercial.&lt;/p&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;window.print()&quot;&gt;Imprimir resolución&lt;/button&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Guía del método&lt;/h2&gt;&lt;ol&gt;&lt;li&gt;Descontar el espacio y los aportes de los ingredientes fijos.&lt;/li&gt;&lt;li&gt;Plantear las ecuaciones de inclusión, proteína y energía.&lt;/li&gt;&lt;li&gt;Eliminar X entre inclusión y proteína; despejar Y₁.&lt;/li&gt;&lt;li&gt;Eliminar X entre inclusión y energía; despejar Y₂.&lt;/li&gt;&lt;li&gt;Igualar Y₁ y Y₂ para calcular Z; sustituir para obtener Y y X.&lt;/li&gt;&lt;li&gt;Calcular los aportes y verificar los tres balances.&lt;/li&gt;&lt;/ol&gt;&lt;p class=&quot;small&quot;&gt;Referencias metodológicas: &lt;a href=&quot;https://revistas.tec.ac.cr/index.php/matematica/article/view/6777&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Santana Pérez y colaboradores: ecuaciones 3 × 3 en formulación animal&lt;/a&gt;; &lt;a href=&quot;https://cgspace.cgiar.org/server/api/core/bitstreams/fa27b637-252c-4b10-a02e-18d1e607fb51/content&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Gachuiri y Lukuyu (2021), ILRI Manual 45, sección 6.2.3&lt;/a&gt;. Los datos del problema proceden de la página 1 del PDF «ECUACIONES SIMULTANEAS 23-2», proporcionado por el docente.&lt;/p&gt;&lt;div class=&quot;final-actions&quot;&gt;&lt;button class=&quot;secondary&quot; id=&quot;reset&quot;&gt;Reiniciar práctica&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;storage&quot; class=&quot;small&quot;&gt;El avance se guarda en este navegador. No se solicita nombre ni se envían respuestas a un servidor.&lt;/p&gt;&lt;/section&gt;

const DATA={&quot;steps&quot;: [{&quot;title&quot;: &quot;Balance de los ingredientes fijos&quot;, &quot;intro&quot;: &quot;Suma las inclusiones fijas y sus aportes: inclusión × contenido ÷ 100. Después resta cada aporte fijo de su requerimiento. La energía de este ejercicio es ED.&quot;, &quot;fields&quot;: [{&quot;label&quot;: &quot;Inclusión fija (%)&quot;, &quot;value&quot;: 6.0}, {&quot;label&quot;: &quot;Aporte fijo de PC&quot;, &quot;value&quot;: 0.0}, {&quot;label&quot;: &quot;Aporte fijo de ED (Mcal/kg MS)&quot;, &quot;value&quot;: 0.45}, {&quot;label&quot;: &quot;Inclusión pendiente (%)&quot;, &quot;value&quot;: 94.0}, {&quot;label&quot;: &quot;PC pendiente&quot;, &quot;value&quot;: 11.57}, {&quot;label&quot;: &quot;ED pendiente (Mcal/kg MS)&quot;, &quot;value&quot;: 2.44}], &quot;hint&quot;: &quot;Cada ingrediente fijo ocupa espacio. Suma sus aportes por separado; que no aporte proteína no significa que no aporte energía.&quot;, &quot;solution&quot;: &quot;Fijos = 6%; PC fija = 0; ED fija = 0.45. Pendientes: 94%; 11.57 de PC; 2.44 Mcal/kg MS.&quot;}, {&quot;title&quot;: &quot;Plantear las tres ecuaciones&quot;, &quot;intro&quot;: &quot;X = Heno de avena, Y = Heno de alfalfa, Z = Maíz rolado. Cada letra es su porcentaje de inclusión en base seca. Completa las ecuaciones de inclusión, PC y ED.&quot;, &quot;fields&quot;: [{&quot;label&quot;: &quot;E1: término independiente&quot;, &quot;value&quot;: 94.0}, {&quot;label&quot;: &quot;E2: coeficiente X&quot;, &quot;value&quot;: 0.095}, {&quot;label&quot;: &quot;E2: coeficiente Y&quot;, &quot;value&quot;: 0.199}, {&quot;label&quot;: &quot;E2: coeficiente Z&quot;, &quot;value&quot;: 0.104}, {&quot;label&quot;: &quot;E2: término independiente&quot;, &quot;value&quot;: 11.57}, {&quot;label&quot;: &quot;E3: coeficiente X&quot;, &quot;value&quot;: 1.92}, {&quot;label&quot;: &quot;E3: coeficiente Y&quot;, &quot;value&quot;: 2.48}, {&quot;label&quot;: &quot;E3: coeficiente Z&quot;, &quot;value&quot;: 3.84}, {&quot;label &lt;section class=&quot;card&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Práctica guiada · Tres incógnitas&lt;/div&gt;&lt;h2&gt;Una ración, tres balances&lt;/h2&gt;&lt;p&gt;Formula una ración para cerdos de 18 kg que contenga &lt;strong&gt;20.9% de proteína cruda&lt;/strong&gt; y &lt;strong&gt;3.26 Mcal de energía metabolizable por kg de materia seca&lt;/strong&gt;, respetando los ingredientes fijos del ejercicio.&lt;/p&gt;&lt;div class=&quot;goals&quot;&gt;&lt;span&gt;Inclusión: &lt;strong&gt;100%&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;PC: &lt;strong&gt;20.9%&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;EM: &lt;strong&gt;3.260 Mcal/kg MS&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;legend&quot;&gt;&lt;div class=&quot;chip x&quot;&gt;X · Sorgo grano&lt;/div&gt;&lt;div class=&quot;chip y&quot;&gt;Y · Pasta de soya&lt;/div&gt;&lt;div class=&quot;chip z&quot;&gt;Z · Maíz grano&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Resuelve en orden. Todos los pasos están a la vista, pero sus campos se habilitan al verificar correctamente el paso anterior. Puedes abrir una pista y volver a intentarlo sin límite.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Se conservan los datos del ejercicio original. Las inclusiones y los aportes nutricionales se calculan en base seca. Cerdo de 18 kg. Pasta de canola, aceite y premezcla son ingredientes fijos.&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Composición e inclusiones fijas&lt;/h2&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Ingrediente&lt;/th&gt;&lt;th&gt;Inclusión (%)&lt;/th&gt;&lt;th&gt;PC (%)&lt;/th&gt;&lt;th&gt;EM (Mcal/kg)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;ingredients&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;PC = proteína cruda; EM = energía metabolizable; PMZ = premezcla. “Variable” significa que su inclusión debe calcularse. Los valores cero son los indicados por el ejercicio, no una caracterización completa de los ingredientes.&lt;/p&gt;&lt;/section&gt;
&lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Respuestas a tres decimales.&lt;/strong&gt; Puedes usar punto o coma decimal. Redondea al final de cada respuesta. Para continuar el procedimiento, usa las ecuaciones exactas que se revelan al aprobar cada paso: redondear repetidamente los coeficientes puede alterar el resultado.&lt;/aside&gt;&lt;div id=&quot;steps&quot;&gt;&lt;/div&gt;
&lt;section id=&quot;finish&quot; class=&quot;card complete&quot; hidden&gt;&lt;div class=&quot;eyebrow&quot;&gt;Ejercicio completado&lt;/div&gt;&lt;h2&gt;Los tres balances coinciden&lt;/h2&gt;&lt;p&gt;Has resuelto el sistema por eliminación e igualación y comprobado los aportes de la dieta completa.&lt;/p&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Ingrediente&lt;/th&gt;&lt;th&gt;Inclusión (%)&lt;/th&gt;&lt;th&gt;Aporte PC&lt;/th&gt;&lt;th&gt;Aporte EM&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;final-table&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Tabla redondeada a tres decimales. Los totales se calculan con precisión completa: sumar las cifras visibles puede producir diferencias de 0.001 por redondeo. Esta práctica ajusta inclusión, PC y EM; no evalúa los demás requerimientos nutricionales de una dieta comercial.&lt;/p&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;window.print()&quot;&gt;Imprimir resolución&lt;/button&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Guía del método&lt;/h2&gt;&lt;ol&gt;&lt;li&gt;Descontar el espacio y los aportes de los ingredientes fijos.&lt;/li&gt;&lt;li&gt;Plantear las ecuaciones de inclusión, proteína y energía.&lt;/li&gt;&lt;li&gt;Eliminar X entre inclusión y proteína; despejar Y₁.&lt;/li&gt;&lt;li&gt;Eliminar X entre inclusión y energía; despejar Y₂.&lt;/li&gt;&lt;li&gt;Igualar Y₁ y Y₂ para calcular Z; sustituir para obtener Y y X.&lt;/li&gt;&lt;li&gt;Calcular los aportes y verificar los tres balances.&lt;/li&gt;&lt;/ol&gt;&lt;p class=&quot;small&quot;&gt;Referencias metodológicas: &lt;a href=&quot;https://revistas.tec.ac.cr/index.php/matematica/article/view/6777&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Santana Pérez y colaboradores: ecuaciones 3 × 3 en formulación animal&lt;/a&gt;; &lt;a href=&quot;https://cgspace.cgiar.org/server/api/core/bitstreams/fa27b637-252c-4b10-a02e-18d1e607fb51/content&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Gachuiri y Lukuyu (2021), ILRI Manual 45, sección 6.2.3&lt;/a&gt;. Los datos del problema proceden de la página 2 del PDF «ECUACIONES SIMULTANEAS 23-2», proporcionado por el docente.&lt;/p&gt;&lt;div class=&quot;final-actions&quot;&gt;&lt;button class=&quot;secondary&quot; id=&quot;reset&quot;&gt;Reiniciar práctica&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;storage&quot; class=&quot;small&quot;&gt;El avance se guarda en este navegador. No se solicita nombre ni se envían respuestas a un servidor.&lt;/p&gt;&lt;/section&gt;
&lt;/main&gt;&lt;footer&gt;Alimentos y alimentación animal · Práctica de formulación por ecuaciones simultáneas&lt;br&gt;Archivo autónomo compatible con GitHub Pages&lt;/footer&gt;&lt;script&gt;
const DATA={&quot;steps&quot;: [{&quot;title&quot;: &quot;Balance de los ingredientes fijos&quot;, &quot;intro&quot;: &quot;Suma las inclusiones fijas y sus aportes: inclusión × contenido ÷ 100. Después resta cada aporte fijo de su requerimiento. La energía de este ejercicio es EM.&quot;, &quot;fields&quot;: [{&quot;label&quot;: &quot;Inclusión fija (%)&quot;, &quot;value&quot;: 13.5}, {&quot;label&quot;: &quot;Aporte fijo de PC&quot;, &quot;value&quot;: 2.2495}, {&quot;label&quot;: &quot;Aporte fijo de EM (Mcal/kg MS)&quot;, &quot;value&quot;: 0.61715}, {&quot;label&quot;: &quot;Inclusión pendiente (%)&quot;, &quot;value&quot;: 86.5}, {&quot;label&quot;: &quot;PC pendiente&quot;, &quot;value&quot;: 18.6505}, {&quot;label&quot;: &quot;EM pendiente (Mcal/kg MS)&quot;, &quot;value&quot;: 2.64285}], &quot;hint&quot;: &quot;Cada ingrediente fijo ocupa espacio. Suma sus aportes por separado; que no aporte proteína no significa que no aporte energía.&quot;, &quot;solution&quot;: &quot;Fijos = 13.5%; PC fija = 2.2495; EM fija = 0.61715. Pendientes: 86.5%; 18.6505 de PC; 2.64285 Mcal/kg MS.&quot;}, {&quot;title&quot;: &quot;Plantear las tres ecuaciones&quot;, &quot;intro&quot;: &quot;X = Sorgo grano, Y = Pasta de soya, Z = Maíz grano. Cada letra es su porcentaje de inclusión en base seca. Completa las ecuaciones de inclusión, PC y EM.&quot;, &quot;fields&quot;: [{&quot;label&quot;: &quot;E1: término independiente&quot;, &quot;value&quot;: 86.5}, {&quot;label&quot;: &quot;E2: coeficiente X&quot;, &quot;value&quot;: 0.126}, {&quot;label&quot;: &quot;E2: coeficiente Y&quot;, &quot;value&quot;: 0.44}, {&quot;label&quot;: &quot;E2: coeficiente Z&quot;, &quot;value&quot;: 0.098}, {&quot;label&quot;: &quot;E2: término independiente&quot;, &quot;value&quot;: 18.6505}, {&quot;label&quot;: &quot;E3: coeficiente X&quot;, &quot;value&quot;: 2.96}, {&quot;label&quot;: &quot;E3: coeficiente Y&quot;, &quot;value&quot;: 2.98}, {&quot;label&quot;: &quot;E3: coeficiente Z&quot;, &quot;value&quot;: 3.24}, {&quot;label&quot;: &quot;E3: término independiente&quot;, &quot;value&quot;: 264.285}], &quot;hint&quot;: &quot;En PC divide las concentraciones entre 100. Para conservar los coeficientes de energía originales, multiplica el aporte pendiente de energía por 100.&quot;, &quot;solution&quot;: &quot;E1: X + Y + Z = 86.5&lt;br&gt;E2: 0.126X + 0.44Y + 0.098Z = 18.6505&lt;br&gt;E3: 2.96X + 2.98Y + 3.24Z = 264.285&quot;}, {&quot;title&quot;: &quot;Formar la ecuación 4&quot;, &quot;intro&quot;: &quot;Multiplica TODOS los términos de E1 por 0.126, el coeficiente de X en E2.&quot;, &quot;fields&quot;: [{&quot;label&quot;: &quot;Coeficiente X&quot;, &quot;value&quot;: 0.126}, {&quot;label&quot;: &quot;Coeficiente Y&quot;, &quot;value&quot;: 0.126}, {&quot;label&quot;: &quot;Coeficiente Z&quot;, &quot;value&quot;: 0.126}, {&quot;label&quot;: &quot;Término independiente&quot;, &quot;value&quot;: 10.899}], &quot;hint&quot;: &quot;También debes multiplicar el término a la derecha del signo igual.&quot;, &quot;solution&quot;: &quot;E4: 0.126X + 0.126Y + 0.126Z = 10.899&quot;}, {&quot;title&quot;: &quot;Formar la ecuación 5&quot;, &quot;intro&quot;: &quot;Multiplica E2 por −1. Escribe cada coeficiente con su signo.&quot;, &quot;fields&quot;: [{&quot;label&quot;: &quot;Coeficiente X&quot;, &quot;value&quot;: -0.126}, {&quot;label&quot;: &quot;Coeficiente Y&quot;, &quot;value&quot;: -0.44}, {&quot;label&quot;: &quot;Coeficiente Z&quot;, &quot;value&quot;: -0.098}, {&quot;label&quot;: &quot;Término independiente&quot;, &quot;value&quot;: -18.6505}], &quot;hint&quot;: &quot;Multiplicar por −1 cambia el signo de todos los términos, incluido el lado derecho.&quot;, &quot;solution&quot;: &quot;E5: −0.126X − 0.44Y − 0.098Z = −18.6505&quot;}, {&quot;title&quot;: &quot;Eliminar X y despejar Y₁&quot;, &quot;intro&quot;: &quot;Suma E4 + E5. Expresa Y₁ = (A − B·Z) / C. Introduce los coeficientes con su signo.&quot;, &quot;fields&quot;: [{&quot;label&quot;: &quot;Coeficiente Y de la suma&quot;, &quot;value&quot;: -0.314}, {&quot;label&quot;: &quot;Coeficiente Z de la suma&quot;, &quot;value&quot;: 0.028}, {&quot;label&quot;: &quot;Término independiente&quot;, &quot;value&quot;: -7.7515}, {&quot;label&quot;: &quot;A del numerador&quot;, &quot;value&quot;: -7.7515}, {&quot;label&quot;: &quot;B que multiplica Z&quot;, &quot;value&quot;: 0.028}, {&quot;label&quot;: &quot;C del denominador&quot;, &quot;value&quot;: -0.314}], &quot;hint&quot;: &quot;X se cancela. Para despejar Y resta el término completo de Z en ambos lados y divide entre el coeficiente de Y. Si B es negativo, restarlo equivale a sumarlo.&quot;, &quot;solution&quot;: &quot;(-0.314)Y + (0.028)Z = -7.7515&lt;br&gt;Y₁ = (-7.7515 − (0.028)Z) / (-0.314)&quot;}, {&quot;title&quot;: &quot;Formar la ecuación 6&quot;, &quot;intro&quot;: &quot;Multiplica E1 por 2.96, el coeficiente de X en E3.&quot;, &quot;fields&quot;: [{&quot;label&quot;: &quot;Coeficiente X&quot;, &quot;value&quot;: 2.96}, {&quot;label&quot;: &quot;Coeficiente Y&quot;, &quot;value&quot;: 2.96}, {&quot;label&quot;: &quot;Coeficiente Z&quot;, &quot;value&quot;: 2.96}, {&quot;label&quot;: &quot;Término independiente&quot;, &quot;value&quot;: 256.04}], &quot;hint&quot;: &quot;Multiplica todos los términos por el mismo factor.&quot;, &quot;solution&quot;: &quot;E6: 2.96X + 2.96Y + 2.96Z = 256.04&quot;}, {&quot;title&quot;: &quot;Formar la ecuación 7&quot;, &quot;intro&quot;: &quot;Multiplica E3 por −1.&quot;, &quot;fields&quot;: [{&quot;label&quot;: &quot;Coeficiente X&quot;, &quot;value&quot;: -2.96}, {&quot;label&quot;: &quot;Coeficiente Y&quot;, &quot;value&quot;: -2.98}, {&quot;label&quot;: &quot;Coeficiente Z&quot;, &quot;value&quot;: -3.24}, {&quot;label&quot;: &quot;Término independiente&quot;, &quot;value&quot;: -264.285}], &quot;hint&quot;: &quot;El signo de cada coeficiente y del término independiente se invierte.&quot;, &quot;solution&quot;: &quot;E7: −2.96X − 2.98Y − 3.24Z = −264.285&quot;}, {&quot;title&quot;: &quot;Eliminar X y despejar Y₂&quot;, &quot;intro&quot;: &quot;Suma E6 + E7. Expresa Y₂ = (A + B·Z) / C. Escribe los coeficientes con su signo.&quot;, &quot;fields&quot;: [{&quot;label&quot;: &quot;Coeficiente Y de la suma&quot;, &quot;value&quot;: -0.02}, {&quot;label&quot;: &quot;Coeficiente Z de la suma&quot;, &quot;value&quot;: -0.28}, {&quot;label&quot;: &quot;Término independiente&quot;, &quot;value&quot;: -8.245}, {&quot;label&quot;: &quot;A del numerador&quot;, &quot;value&quot;: -8.245}, {&quot;label&quot;: &quot;B que multiplica Z&quot;, &quot;value&quot;: 0.28}, {&quot;label&quot;: &quot;C del denominador&quot;, &quot;value&quot;: -0.02}], &quot;hint&quot;: &quot;Para despejar Y, el término de Z cambia de signo al restarlo de ambos lados.&quot;, &quot;solution&quot;: &quot;(-0.02)Y + (-0.28)Z = -8.245&lt;br&gt;Y₂ = (-8.245 − (-0.28)Z) / (-0.02)&quot;}, {&quot;title&quot;: &quot;Igualar Y₁ y Y₂&quot;, &quot;intro&quot;: &quot;Las dos expresiones representan la misma inclusión. Multiplica en cruz: (-0.02)(-7.7515 − (0.028)Z) = (-0.314)(-8.245 − (-0.28)Z).&quot;, &quot;fields&quot;: [{&quot;label&quot;: &quot;Constante izquierda&quot;, &quot;value&quot;: 0.15503}, {&quot;label&quot;: &quot;Coeficiente Z izquierdo&quot;, &quot;value&quot;: 0.00056}, {&quot;label&quot;: &quot;Constante derecha&quot;, &quot;value&quot;: 2.58893}, {&quot;label&quot;: &quot;Coeficiente Z derecho&quot;, &quot;value&quot;: -0.08792}], &quot;hint&quot;: &quot;Distribuye cada factor en los dos términos del numerador opuesto. Incluye el signo de cada coeficiente.&quot;, &quot;solution&quot;: &quot;0.15503 + (0.00056)Z = 2.58893 + (-0.08792)Z&quot;}, {&quot;title&quot;: &quot;Despejar Z: inclusión de Maíz grano&quot;, &quot;intro&quot;: &quot;Agrupa los términos de Z a la izquierda y las constantes a la derecha. Usa la igualdad exacta del paso anterior. Queda a·Z = b.&quot;, &quot;fields&quot;: [{&quot;label&quot;: &quot;a: coeficiente Z&quot;, &quot;value&quot;: 0.08848}, {&quot;label&quo &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;header&gt;&lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;h1&gt;&lt;span class=&quot;icon&quot; aria-hidden=&quot;true&quot;&gt;∑&lt;/span&gt; ECUACIONES SIMULTÁNEAS&lt;/h1&gt;&lt;p&gt;Formulación de raciones · Gallinas de postura&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;progress&quot;&gt;&lt;span id=&quot;progress-label&quot;&gt;&lt;/span&gt;&lt;progress id=&quot;progress&quot; max=&quot;14&quot; value=&quot;0&quot; aria-label=&quot;Progreso del ejercicio&quot;&gt;&lt;/progress&gt;&lt;/div&gt;&lt;/div&gt;&lt;/header&gt;&lt;main&gt;
&lt;section class=&quot;card&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Práctica guiada · Tres incógnitas&lt;/div&gt;&lt;h2&gt;Una ración, tres balances&lt;/h2&gt;&lt;p&gt;Formula una ración para gallinas de postura que contenga &lt;strong&gt;15% de proteína cruda&lt;/strong&gt; y &lt;strong&gt;2.9 Mcal de energía metabolizable por kg&lt;/strong&gt;, respetando los ingredientes fijos del ejercicio.&lt;/p&gt;&lt;div class=&quot;goals&quot;&gt;&lt;span&gt;Inclusión: &lt;strong&gt;100%&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;PC: &lt;strong&gt;15%&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;EM: &lt;strong&gt;2.900 Mcal/kg&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;legend&quot;&gt;&lt;div class=&quot;chip x&quot;&gt;X · Sorgo grano&lt;/div&gt;&lt;div class=&quot;chip y&quot;&gt;Y · Pasta de soya&lt;/div&gt;&lt;div class=&quot;chip z&quot;&gt;Z · Maíz grano&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Resuelve en orden. Todos los pasos están a la vista, pero sus campos se habilitan al verificar correctamente el paso anterior. Puedes abrir una pista y volver a intentarlo sin límite.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Esta adaptación utiliza ecuaciones simultáneas, aunque el enunciado original proponga Pearson. La soya se trata como un solo ingrediente: no se divide en M1 y M2. Se conservan los datos nutricionales del ejercicio.&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Composición e inclusiones fijas&lt;/h2&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Ingrediente&lt;/th&gt;&lt;th&gt;Inclusión (%)&lt;/th&gt;&lt;th&gt;PC (%)&lt;/th&gt;&lt;th&gt;EM (Mcal/kg)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;ingredients&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;PC = proteína cruda; EM = energía metabolizable; PMZ = premezcla. “Variable” significa que su inclusión debe calcularse. Los valores cero son los indicados por el ejercicio, no una caracterización completa de los ingredientes.&lt;/p&gt;&lt;/section&gt;
&lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Respuestas a tres decimales.&lt;/strong&gt; Puedes usar punto o coma decimal. Redondea al final de cada respuesta. Para continuar el procedimiento, usa las ecuaciones exactas que se revelan al aprobar cada paso: redondear repetidamente los coeficientes puede alterar el resultado.&lt;/aside&gt;&lt;div id=&quot;steps&quot;&gt;&lt;/div&gt;
&lt;section id=&quot;finish&quot; class=&quot;card complete&quot; hidden&gt;&lt;div class=&quot;eyebrow&quot;&gt;Ejercicio completado&lt;/div&gt;&lt;h2&gt;Los tres balances coinciden&lt;/h2&gt;&lt;p&gt;Has resuelto el sistema por eliminación e igualación y comprobado los aportes de la dieta completa.&lt;/p&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Ingrediente&lt;/th&gt;&lt;th&gt;Inclusión (%)&lt;/th&gt;&lt;th&gt;Aporte PC&lt;/th&gt;&lt;th&gt;Aporte EM&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;final-table&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Tabla redondeada a tres decimales. Los totales se calculan con precisión completa: sumar las cifras visibles puede producir diferencias de 0.001 por redondeo. Esta práctica ajusta inclusión, PC y EM; no evalúa los demás requerimientos nutricionales de una dieta comercial.&lt;/p&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;window.print()&quot;&gt;Imprimir resolución&lt;/button&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Guía del método&lt;/h2&gt;&lt;ol&gt;&lt;li&gt;Descontar el espacio y los aportes de los ingredientes fijos.&lt;/li&gt;&lt;li&gt;Plantear las ecuaciones de inclusión, proteína y energía.&lt;/li&gt;&lt;li&gt;Eliminar X entre inclusión y proteína; despejar Y₁.&lt;/li&gt;&lt;li&gt;Eliminar X entre inclusión y energía; despejar Y₂.&lt;/li&gt;&lt;li&gt;Igualar Y₁ y Y₂ para calcular Z; sustituir para obtener Y y X.&lt;/li&gt;&lt;li&gt;Calcular los aportes y verificar los tres balances.&lt;/li&gt;&lt;/ol&gt;&lt;p class=&quot;small&quot;&gt;Referencias metodológicas: &lt;a href=&quot;https://revistas.tec.ac.cr/index.php/matematica/article/view/6777&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Santana Pérez y colaboradores: ecuaciones 3 × 3 en formulación animal&lt;/a&gt;; &lt;a href=&quot;https://cgspace.cgiar.org/server/api/core/bitstreams/fa27b637-252c-4b10-a02e-18d1e607fb51/content&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Gachuiri y Lukuyu (2021), ILRI Manual 45, sección 6.2.3&lt;/a&gt;. Los datos del problema proceden de la página 2 del ejercicio proporcionado por el docente.&lt;/p&gt;&lt;div class=&quot;final-actions&quot;&gt;&lt;button class=&quot;secondary&quot; id=&quot;reset&quot;&gt;Reiniciar práctica&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;storage&quot; class=&quot;small&quot;&gt;El avance se guarda en este navegador. No se solicita nombre ni se envían respuestas a un servidor.&lt;/p&gt;&lt;/section&gt;
